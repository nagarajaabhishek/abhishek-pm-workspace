      Vision Router: Gemini Vision primary → OpenAI GPT-4o-mini fallback (30s timeout); hybrid recall fires a second provider pass when item-count delta ≥ 3, merging results via normalizedLabel|lineTotalCents|quantity key deduplication (max 2 extra passes); HEIC→JPEG via heic-convert WASM, TIFF/BMP→JPEG via Sharp; PDFs rejected from OpenAI path.
