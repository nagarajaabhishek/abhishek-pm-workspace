    architecture: >
      Published open-source CLI utility (npm: @abhishek.nagaraja/catms) providing workflow scaffolding and a local
      MCP (Model Context Protocol) memory server for multi-agent teams working across Cursor, Claude Desktop, and
      Google Antigravity on one codebase — addressing agent statelessness, where every new session normally forgets
      prior context, causing duplicated work and lost decisions when multiple agents and a human share a codebase.
      Runs a local RAG pipeline on PostgreSQL + pgvector + Ollama, automatically chunking and embedding Markdown
      session logs from an Obsidian vault for context-aware retrieval. Exposes three dynamic agent tools —
      cams_query, cams_ingest, cams_backfill — letting agents autonomously query historical decisions and backfill
      new context. Generalized from the project-specific CAMS instance built for Logos Tax Systems into a reusable,
      installable package.
    key_features:
      - "Published, installable CLI (npm i @abhishek.nagaraja/catms) — not just an internal template"
      - "Local MCP memory server supporting Cursor, Claude Desktop, and Google Antigravity simultaneously on one codebase"
      - "Local RAG pipeline: PostgreSQL + pgvector + Ollama, auto-chunking/embedding Markdown session logs from an Obsidian vault"
      - "Three agent-callable tools: cams_query (retrieve historical decisions), cams_ingest (record new context), cams_backfill (bulk re-embed trackers/logs)"
      - "Workflow scaffolding to bootstrap the AGENTS.md/CLAUDE.md/CURSOR.md source-of-truth convention in a new repo"
    bullets:
      - "Authored and published a CLI utility on NPM (\\textbf{@abhishek.nagaraja/catms}) providing workflow scaffolding and a local \\textbf{Model Context Protocol (MCP)} memory server for multi-agent teams across \\textbf{Cursor}, \\textbf{Claude Desktop}, and \\textbf{Google Antigravity}."
      - "Engineered a local RAG pipeline using \\textbf{PostgreSQL}, \\textbf{pgvector}, and \\textbf{Ollama}, automatically chunking and embedding Markdown session logs from an Obsidian vault to provide context-aware retrieval."
      - "Exposed dynamic agent tools (\\texttt{cams\\_query}, \\texttt{cams\\_ingest}, \\texttt{cams\\_backfill}), allowing agents to autonomously query historical decisions and backfill new context to solve long-term memory limits."

