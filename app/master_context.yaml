      - "Cut receipt processing errors by \\textbf{40%+} by engineering a \\textbf{hybrid vision recall pipeline} that cross-validates Gemini Vision against OpenAI GPT-4o-mini, auto-triggering the secondary provider when item-count delta exceeds 3—catching missed line items across HEIC, TIFF, and PDF formats."
