  - id: "resume_agent"
    name: "Resume Agent & Job Search Automation"
    url: "https://github.com/nagarajaabhishek/resume_agent"
    date: "Feb 2026 - Present"
    tags: ["ai", "engineering", "automation", "product"]
    description: "LaTeX resume engine (YAML → Jinja2 → custom class) integrated into a Job Automation monorepo: sheet-backed sourcing/evaluation, master-profile–grounded scoring, and per-JD tailoring with QA."

    tech_stack:
      - "Python"
      - "LaTeX (custom .cls + Jinja2 templates)"
      - "FastAPI"
      - "React"
      - "Google Sheets API"
      - "pdflatex"
      - "OpenAI / Claude / Gemini (LLM backbone)"
      - "LangChain"
      - "pandas"
    integrations:
      - "Google Sheets API — job database (sourcing → evaluation → tailoring → PDF tracking) and the Manual JD Tailor sheet workflow"
      - "OpenAI / Anthropic Claude / Google Gemini — LLM backbone for job evaluation scoring and resume-bullet tailoring, via LangChain"
      - "JobSpy meta-aggregator — LinkedIn/Indeed/Google/ZipRecruiter job sourcing"
      - "ATS boards (Greenhouse, Lever, Ashby) and community job boards (Remotive, RemoteOK, Dice, SmartRecruiters, Recruitee) — additional sourcing channels"
    architecture: >
      Multi-agent job search monorepo with a daily pipeline runner (run_pipeline.py) orchestrating 4 phases: parallel sourcing from 15+ scrapers (JobSpy meta-aggregator for LinkedIn/Indeed/Google/ZipRecruiter, Jobright GitHub READMEs, ATS boards via Greenhouse/Lever/Ashby, and community sources Remotive/RemoteOK/Dice/SmartRecruiters), batch LLM evaluation (2-3 jobs/call) producing a 0-100 Apply Conviction Score with 6-tier verdicts, TailorAgent resume generation (clone base YAML → LLM bullet/title swaps → 10-attempt QA loop → pdflatex PDF), and cycle intelligence cache updates (sponsorship status, skill gap frequency, salary benchmarks, company tech stacks).
      Resume engine: strict Jinja2 → LaTeX pipeline with SKILL.md enforcement — 215-245 char XYZ bullets, forbidden verb auto-replacement, metric bold-wrapping, full month names, and ATS-safe single-column Charter-font layout.
      Operator surfaces: FastAPI backend + React Vite dashboard on top of Google Sheets as job DB (daily tabs); Manual JD Tailor Sheet tab for URL-paste → auto-tailor → PDF back-link.
      Scoring: base LLM score (0-100) + learned-patterns calibration (±15 delta cap) = final Apply Conviction Score; snippet-first mode (2,200 chars) with full-JD retry for gray-zone scores 68-82.
    key_features:
      - "15+ job scrapers: JobSpy (LinkedIn/Indeed/Google/ZipRecruiter), Jobright GitHub README repos, ATS boards (Greenhouse, Lever, Ashby), Remotive, RemoteOK, Dice, SmartRecruiters, Recruitee"
      - "0-100 Apply Conviction Score with 6-tier verdicts: Must-Apply (85+), Strong Match (70+), Ambitious (60+), Worth Considering (40+), Low Priority (20+), No (<20)"
      - "Adaptive interleaved sourcing: starts at 15 jobs/batch, scales to 40 on stall; stops when 50 jobs reach 80+ score"
      - "Snippet-first LLM evaluation (2,200 chars → full JD retry for gray-zone 68-82 scores to save tokens)"
      - "Post-hoc calibration via learned_patterns.yaml (±15 point cap, audit trail per row via DecisionAudit JSON)"
      - "TailorAgent: clone base YAML → LLM bullet/title swaps → up to 10-attempt self-healing QA loop with deterministic forbidden-verb fixes"
      - "SKILL.md validation: 215-245 char bullets, XYZ formula, forbidden verb bans (Managed→Led, Helped→Supported, etc.), full month names, metric bolding"
      - "Intelligence caches auto-updated per cycle: sponsorship status (Verified/Does Not Sponsor), skill gap frequency, salary benchmarks by role+location, company tech stacks"
      - "Evidence JSON per sheet row: score_breakdown (title_match, skill_alignment, location_fit, sponsorship, seniority), gap analysis, confidence, JD quality"
      - "Google Sheets as job DB: sourcing → evaluation → tailoring → PDF path tracking in daily date tabs"
      - "Deep packet generation (markdown evaluation report) for scores ≥90; tailor payload JSON export for scores ≥80"
    bullets:
      - "Own the \\textbf{single source of truth} path from `master_context.yaml` through role-specific YAML and compiled dense profile matrices, so LLM job evaluation and resume bullets stay auditable, consistent, and ATS-safe (XYZ bullets, weak-verb bans, two-page limits)."
      - "Implemented \\textbf{TailorAgent} in the automation repo: on strong matches it clones a base role YAML, applies JD-specific LLM edits with guardrails from the tailor QA checklist, and regenerates structured `.tex`/PDF outputs—wired into the main pipeline CLI and `tailor_from_urls.py` for batch runs and the Manual JD Tailor Google Sheet workflow."
      - "Built \\textbf{operator surfaces} for the same stack—a FastAPI backend and React ops dashboard—on top of Google Sheets for job ingest, verdicts, evidence JSON, and per-row tailor status including PDF paths and optional tailored-vs-generic validation scores."
      - "Designed a \\textbf{0-100 Apply Conviction Score} engine that evaluates jobs across 15+ sources by batch-prompting Gemini 2.5 Flash (2-3 jobs/call) with snippet-first mode, gray-zone full-JD retries, and post-hoc calibration via learned patterns—achieving target of 50 strong-match jobs per daily pipeline run."
      - "Automated \\textbf{intelligence compounding} across every pipeline cycle by mining skill gaps, sponsorship status, salary benchmarks by role and city, and company tech stacks into structured YAML caches—making each subsequent evaluation more precise without added LLM calls."
